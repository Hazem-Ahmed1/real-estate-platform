<aside class="admin-sidebar">
  <div class="brand-section">
    <div class="brand-icon">
      <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
    </div>
    <div>
      <h1 class="brand-title">Real Estate</h1>
      <p class="brand-subtitle">لوحة التخكم</p>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="التنقل الرئيسي">
    <a routerLink="/admin/dashboard" routerLinkActive="nav-link-active" class="nav-link">
      <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
      <span>لوحة التحكم</span>
    </a>
    <a routerLink="/admin/projects" routerLinkActive="nav-link-active" class="nav-link">
      <i class="fa-solid fa-city" aria-hidden="true"></i>
      <span>المشاريع</span>
    </a>
    <a routerLink="/admin/buildings" routerLinkActive="nav-link-active" class="nav-link">
      <i class="fa-solid fa-building" aria-hidden="true"></i>
      <span>المباني</span>
    </a>
    <a routerLink="/admin/units" routerLinkActive="nav-link-active" class="nav-link">
      <i class="fa-solid fa-door-open" aria-hidden="true"></i>
      <span>الوحدات</span>
    </a>
    <a routerLink="/admin/blogs" routerLinkActive="nav-link-active" class="nav-link">
      <i class="fa-solid fa-pen-nib" aria-hidden="true"></i>
      <span>المدونات</span>
    </a>
    <a routerLink="/admin/messages" routerLinkActive="nav-link-active" class="nav-link">
      <i class="fa-regular fa-envelope" aria-hidden="true"></i>
      <span>الرسائل</span>
    </a>
      <a [routerLink]="['/admin','features']" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <i class="fa-solid fa-gem" aria-hidden="true"></i>
        <span>المميزات</span>
      </a>
      <a [routerLink]="['/admin','guarantees']" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        <span>الضمانات</span>
      </a>
  </nav>

  <div class="sidebar-user">
    <div class="user-avatar">A</div>
    <div class="user-meta">
      <p class="user-name"></p>
      <p class="user-role">ادمن</p>
    </div>
    <button class="logout-btn" type="button" aria-label="تسجيل الخروج" (click)="logout()">
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
    </button>
  </div>
</aside>
