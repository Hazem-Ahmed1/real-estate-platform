<div class="gallery-layout">

  <!-- Main Image -->
  @if (images.length > 0) {
    <div class="gallery-main">
      <img
        [src]="images[0]"
        class="gallery-image gallery-image-main"
        data-bs-toggle="modal"
        data-bs-target="#galleryModal"
      />
    </div>
  }

  <!-- Thumbnails -->
  @if (images.length > 1) {
    <div class="row g-3 gallery-thumbs">
      @for (img of images.slice(1); track $index) {
        <div class="col-6 col-md-4 col-lg-3">
          <img
            [src]="img"
            class="gallery-image gallery-image-thumb"
            loading="lazy"
            data-bs-toggle="modal"
            data-bs-target="#galleryModal"
          />
        </div>
      }
    </div>
  }

</div>

<!-- Modal -->
<div
  class="modal fade custom-gallery-modal"
  id="galleryModal"
  (click)="onBackdropClick($event)"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Close -->
      <button class="gallery-close-btn" data-bs-dismiss="modal">✕</button>

      <!-- Carousel -->
      <div id="carouselGallery" class="carousel slide">

        <div class="carousel-inner">
          @for (img of images; track $index; let i = $index) {
            <div class="carousel-item" [class.active]="i === 0">

              <!-- منع الإغلاق -->
              <div class="gallery-modal-frame" (click)="$event.stopPropagation()">
                <img [src]="img" class="gallery-modal-image" />
              </div>

            </div>
          }
        </div>

        <!-- Prev -->
        <button
          class="gallery-nav prev"
          (click)="$event.stopPropagation()"
          data-bs-target="#carouselGallery"
          data-bs-slide="prev"
        >
          ❯

        </button>

        <!-- Next -->
        <button
          class="gallery-nav next"
          (click)="$event.stopPropagation()"
          data-bs-target="#carouselGallery"
          data-bs-slide="next"
        >
          ❮
        </button>

      </div>

    </div>
  </div>
</div>
