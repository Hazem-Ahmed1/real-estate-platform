<div class="sold-card">

  <!-- IMAGE -->
  <div class="card-img">
    <img [src]="project().imageURL" />

    <!-- BADGE -->
    <span class="badge">{{ project().type }}</span>

    <!-- FAVORITE -->
    <div class="favorite">
      <i class="fa-regular fa-heart"></i>
    </div>

    <!-- LOCATION -->
    <div class="location">
      <i class="fa-solid fa-location-dot"></i>
      {{ project().location }}
    </div>

  </div>

  <!-- BODY -->
  <div class="card-body">

    <h5 class="title">{{ project().title }}</h5>

    <!-- FEATURES -->
    <div class="features">

      <span>
        <i class="fa-solid fa-expand"></i>
        {{ project().area }}
      </span>

      <span>
        <i class="fa-solid fa-building"></i>
        {{ project().units }} وحدات سكنية
      </span>

      <span>
        <i class="fa-solid fa-bed"></i>
        {{ project().rooms }} غرف
      </span>

    </div>

  </div>

</div>
