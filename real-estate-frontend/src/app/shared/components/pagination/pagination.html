<div class="pagination-container d-flex justify-content-center align-items-center py-4 gap-2">

  <!-- NEXT (RTL = LEFT GREEN BUTTON) -->
  <button class="page-btn filled"
          (click)="next()"
          [disabled]="currentPage() === totalPages()">
    <i class="fa-solid fa-chevron-right"></i>
  </button>

  <!-- NUMBERS (REVERSED FOR RTL) -->
  @for (page of pages().slice().reverse(); track page) {
    <button
      class="page-btn"
      [class.active]="page === currentPage()"
      (click)="selectPage(page)">
      {{ page }}
    </button>
  }

  <!-- PREV (RTL = RIGHT BUTTON) -->
  <button class="page-btn outline"
          (click)="prev()"
          [disabled]="currentPage() === 1">
        <i class="fa-solid fa-chevron-left"></i>

  </button>

</div>
