<section class="company-goals text-center">
  <div class="container">
    <!-- Header -->
    <div class="mb-5">
      <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
        <span class="text-success fs-5">✦</span>
        <span class="text-success fw-bold">أهداف الشركة</span>
        <div class="bg-success" style="width: 40px; height: 2px;"></div>
      </div>
      <h2 class="fw-bold main-title mt-3">أهداف شركة مجموعة جدة الاولى<br />للاستثمرات العقارية</h2>
    </div>

    <!-- Cards -->
    <div class="row  mt-2 g-4 justify-content-center align-items-stretch">
      @for (card of cards(); track $index) {
        <div class="col-md-6 col-lg-3 d-flex">
          <div class="w-100" (mouseenter)="setActive($index)">
            <app-company-goals-card [data]="card" [isActive]="activeIndex() === $index"></app-company-goals-card>
          </div>
        </div>
      }
    </div>
  </div>
</section>
