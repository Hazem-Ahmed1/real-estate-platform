<div
  class="icon-grid stagger-fade-in"
  [class.icon-grid--features]="variant() === 'features'"
  [class.icon-grid--warranties]="variant() === 'warranties'">
  @for (item of items(); track item.label) {
    <div class="icon-grid-item d-flex flex-column align-items-center text-center">
      <div class="icon-wrap mb-2 d-flex align-items-center justify-content-center">
        <i [class]="'icon-grid-icon fa-solid fa-lg ' + item.iconClass"></i>
      </div>

      <h6 class="item-title mb-1">{{ item.label }}</h6>

      @if (item.subLabel) {
        <p class="item-subtitle mb-0">{{ item.subLabel }}</p>
      }
    </div>
  }
</div>
