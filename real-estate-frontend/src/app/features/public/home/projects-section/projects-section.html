<section class="projects-section">
  <div class="container">

    <app-home-section-header-with-filters
      (filterChange)="filter($event)"
      title="المشـــــــاريع الحـــالية"
      subTitle="عـــقاراتنا"
      url="/test"
    />
    <!-- Cards -->
    <div class="row justify-content-center g-4">
      @for (projectCard of projects; track $index) {
        <div class="col-lg-4 col-md-6">
          <app-project-card [project]="projectCard"></app-project-card>
        </div>
      }
    </div>
  </div>
</section>
