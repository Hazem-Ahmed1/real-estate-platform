<div class="gallery-layout">

  <!-- Main Image -->
  @if (images.length > 0) {
    <div class="gallery-main">
      <img
        [src]="images[0]"
        class="gallery-image gallery-image-main"
        data-bs-toggle="modal"
        [attr.data-bs-target]="'#' + modalId"
        (click)="openCarousel(0)"
      />
    </div>
  }

  <!-- Thumbnails -->
  @if (images.length > 1) {
    <div class="row g-3 gallery-thumbs justify-content-center">
      @for (img of images.slice(1); track $index; let i = $index) {
        <div class="col-6 col-md-4 col-lg-3">
          <img
            [src]="img"
            class="gallery-image gallery-image-thumb"
            loading="lazy"
            data-bs-toggle="modal"
            [attr.data-bs-target]="'#' + modalId"
            (click)="openCarousel(i + 1)"
          />
        </div>
      }
    </div>
  }

</div>

<!-- Modal -->
<div
  class="modal fade custom-gallery-modal"
  [id]="modalId"
  (click)="onBackdropClick($event)"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Close -->
      <button class="gallery-close-btn" data-bs-dismiss="modal">✕</button>

      <!-- Carousel -->
      <div [id]="carouselId" class="carousel slide">

        <div class="carousel-inner">
          @for (img of images; track $index; let i = $index) {
            <div class="carousel-item" [class.active]="i === currentIndex">

              <div class="gallery-modal-frame" (click)="$event.stopPropagation()">
                <img
                  [src]="img"
                  class="gallery-modal-image"
                  [class.zoomed]="isZoomed"
                  (click)="toggleZoom()"
                />
              </div>

            </div>
          }
        </div>

        <!-- Prev -->
        <button
          class="gallery-nav prev"
          (click)="$event.stopPropagation()"
          [attr.data-bs-target]="'#' + carouselId"
          data-bs-slide="prev"
        >
          ❯
        </button>

        <!-- Next -->
        <button
          class="gallery-nav next"
          (click)="$event.stopPropagation()"
          [attr.data-bs-target]="'#' + carouselId"
          data-bs-slide="next"
        >
          ❮
        </button>

      </div>

    </div>
  </div>
</div>
