<div class="card-box p-4 h-100 text-center"
     [ngClass]="{'highlighted': data.highlighted}">

  <div class="icon mb-3">
    <i class="bi" [ngClass]="data.icon"></i>
  </div>

  <h6 class="fw-bold">{{ data.title }}</h6>

  <p class="text-muted small">
    {{ data.description }}
  </p>

  <a href="#" class="read-more">
    اقرأ المزيد →
  </a>

</div>
