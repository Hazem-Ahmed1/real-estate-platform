<app-breadcrumb
  [items]="[{ label: 'الرئيسية', url: '/' }, { label: 'الوحدات', url: '/units' }, { label: unit.title }]"
  [status]="unit.type"
  [price]="+unit.price"
/>

<div class="container unit-details-page">

  <app-unit-hero
    [title]="unit.title"
    [location]="unit.location"
    [metadata]="metadata"
  />

  <app-unit-panorama-contact
    [panoramaImage]="panoramaImage"
  />

  <div class="row mb-5">
    <div class="col-12">
      <app-unit-video
        [videoUrl]="videoUrl"
        [videoPoster]="videoPoster"
      />
    </div>
  </div>

  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'صور'" [title]="'صور من جوانب مختلفة للوحدة'" />
      <app-project-gallery [images]="gallery" />
    </div>
  </div>

  <div class="row mb-5">
    <div class="col-12">
      <app-unit-tabs
        [features]="resolvedFeatures"
        [warranties]="resolvedWarranties"
        [designs]="designGallery"
        [nearbyPlaces]="nearbyPlaces"
      />
    </div>
  </div>

  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'موقع'" [title]="'موقع الوحدة على الخريطة'" />
      <app-project-map [lat]="mapLat" [lng]="mapLng" />
    </div>
  </div>
</div>

<app-contact-section></app-contact-section>
