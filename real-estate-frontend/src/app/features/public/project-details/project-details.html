<app-breadcrumb
  [items]="[{ label: 'الرئيسية', url: '/' }, { label: 'المشاريع', url: '/projects' }, { label: project.title }]"
  [status]="project.type"
/>

<div class="container">

  <app-project-hero
    [title]="project.title"
    [location]="project.location"
    [stats]="stats"
  />

  <div class="row mb-5">
    <div class="col-12">
      <app-project-panorama [panoramaImage]="panoramaImage" />
    </div>
  </div>

  <div class="row mb-5">
    <div class="col-12">
      <app-project-video-section
        [videoUrl]="videoUrl"
        [videoPoster]="videoPoster"
      />
    </div>
  </div>

  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'معرض'" [title]="'صور من جوانب مختلفة للمشروع'" />
      <app-project-gallery [images]="gallery" />
    </div>
  </div>

  <div class="row mb-5">
    <div class="col-12 mb-5">
      <app-section-title [subtitle]="'مميزات'" [title]="'مميزات المشروع'" />
      <app-icon-feature-grid [items]="resolvedFeatures" [variant]="'features'" />
    </div>
    <div class="col-12">
      <app-section-title [subtitle]="'الضمانات'" [title]="'ضمانات المشروع'" />
      <app-icon-feature-grid [items]="resolvedWarranties" [variant]="'warranties'" />
    </div>
  </div>

  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'الموقع'" [title]="'موقع المشروع على الخريطة'" />
      <app-project-map [lat]="mapLat" [lng]="mapLng" />
    </div>
  </div>
</div>

<app-contact-section></app-contact-section>
