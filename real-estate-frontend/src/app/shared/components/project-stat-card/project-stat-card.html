<div class="stat-card position-relative overflow-hidden">
  <img [src]="iconUrl()" [alt]="label()" class="stat-bg w-100 h-100" />
  <div class="stat-overlay position-absolute top-0 start-0 end-0 bottom-0 d-flex flex-column justify-content-between align-items-center text-center text-white">
    <p class="stat-label mb-0 fw-semibold">{{ label() }}</p>
    <div class="stat-value-wrap d-inline-flex align-items-center">
      <span class="stat-value fw-bold">{{ value() }}</span>
      <span class="plus-sign fw-bold">+</span>
    </div>
  </div>
</div>
