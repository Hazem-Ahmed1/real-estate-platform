<div class="form-card" dir="rtl">
  <i class="fa-solid fa-building decor-watermark" aria-hidden="true"></i>
  <div class="decor-line" aria-hidden="true"></div>
  <div class="decor-orbit" aria-hidden="true">
    <span class="decor-star"></span>
  </div>

  <div class="form-inner p-5 text-end d-flex flex-column h-100">
    <h5 class="title mb-4 text-center">تواصل معنا</h5>

    <label class="field-label" for="fullName">الاسم الكامل<span class="req">*</span></label>
    <input id="fullName" class="form-control mb-3" placeholder="الاسم الثلاثي" />

    <label class="field-label" for="phone">رقم الجوال<span class="req">*</span></label>
    <input id="phone" class="form-control mb-3" placeholder="رقم الجوال" />

    <label class="field-label" for="notes">ملاحظات مرفقة</label>
    <textarea id="notes" class="form-control notes" rows="4" placeholder="اكتب هنا..."></textarea>

    <button class="btn send-btn w-100 mt-4" type="button">
      <span>ارسل طلبك الآن</span>
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="whatsapp mt-auto pt-4 d-flex align-items-center justify-content-center gap-3">
      <i class="fa-solid fa-arrow-left"></i>
      <span>تواصل معنا عبر واتساب</span>
      <i class="fa-brands fa-whatsapp"></i>
    </div>
  </div>
</div>
