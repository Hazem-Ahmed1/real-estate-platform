<section class="stats-section">

  <div class="container">

    <div class="row align-items-center">



      <!-- 🔷 RIGHT: TEXT -->
      <div class="col-lg-6 text-end">

        <span class="sub">إنجازاتنا</span>

        <h2 class="title">عدد المشاريع</h2>

        <p class="desc">
          مرحباً بكم في منصتنا العقارية الشاملة، حيث نقدم لكم فرصة مثالية
          لاستكشاف والاستثمار في أفضل العقارات المتاحة في السوق.
        </p>

        <!-- NUMBERS -->
        <div class="numbers d-flex justify-content-start gap-4">

          <div class="num">
            <span class="value">+12</span>
            <p>عدد المشاريع</p>
          </div>

          <div class="num">
            <span class="value">+48</span>
            <p>عدد الوحدات السكنية</p>
          </div>

          <div class="num">
            <span class="value">+10</span>
            <p>سنوات من الخبرة</p>
          </div>

        </div>

      </div>

            <!-- 🔷 LEFT: CARDS GRID -->
      <div class="col-lg-6">

        <div class="stats-grid">

          <app-status-card
            *ngFor="let item of stats"
            [item]="item">
          </app-status-card>

        </div>

      </div>
    </div>

  </div>

</section>
