<app-top-navbar></app-top-navbar>
<app-navbar></app-navbar>
<div class="container project-details-page">
  <!-- Top line -->
  <div
    class="top-line d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-2 pb-3 mb-4 border-bottom"
    dir="rtl"
  >
    <nav class="d-inline-flex align-items-center gap-2 fs-6" aria-label="breadcrumb">
      <a
        routerLink="/"
        class="text-decoration-none text-secondary d-inline-flex align-items-center"
        aria-label="الرئيسية"
      >
        <i class="fa-solid fa-house"></i>
      </a>
      <a routerLink="/" class="text-decoration-none text-secondary">الرئيسية</a>
      <i class="fa-solid fa-chevron-left text-secondary small"></i>
      <a routerLink="/projects" class="text-decoration-none fw-semibold text-secondary">المشاريع</a>
      <i class="fa-solid fa-chevron-left text-secondary small"></i>
      <a routerLink="/project_details" class="text-decoration-none fw-semibold text-primary">{{
        projectDetails.projectName
      }}</a>
    </nav>
    <p class="project-status mb-0 d-inline-flex align-items-center gap-2 fw-bold fs-6">
      <i class="fa-solid fa-up-right-from-square"></i>
      <span>{{ projectDetails.projectType }}</span>
    </p>
  </div>

  <!-- Header Details & Stats -->
  <div class="project-hero mb-5">
    <h1 class="project-name mb-2">{{ projectDetails.projectName }}</h1>
    <p class="project-location mb-4">
      <i class="fa-solid fa-location-dot me-2 ms-2"></i>
      {{ projectDetails.locationText }}
    </p>
    <div class="project-stats-grid">
      @for (stat of projectDetails.stats; track stat.label) {
        <app-project-stat-card [label]="stat.label" [value]="stat.value" [iconUrl]="stat.iconUrl" />
      }
    </div>
  </div>

  <!-- Media 360 -->
  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'صورة'" [title]="'صورة 360 درجة للمشروع'" />
      <div class="panorama-static-card fade-in" aria-label="صورة بانورامية للمشروع">
        <img
          class="panorama-static-image"
          [ngSrc]="projectDetails.media.panoramaImage"
          alt="صورة بانورامية 360 للمشروع"
          fill
          sizes="(max-width: 767px) 100vw, 95vw"
          priority
        />
      </div>
    </div>
  </div>

  <!-- Video -->
  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'فيديو'" [title]="'فيديو كامل للمشروع'" />
      <app-project-video-block
        [videoUrl]="projectDetails.media.videoUrl"
        [poster]="projectDetails.media.videoPoster"
      />
    </div>
  </div>

  <!-- Gallery -->
  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'معرض'" [title]="'صور من جوانب مختلفة للمشروع'" />
      <app-project-gallery [images]="projectDetails.media.gallery" />
    </div>
  </div>

  <!-- Features & Warranties -->
  <div class="row mb-5">
    <div class="col-12 mb-5">
      <app-section-title [subtitle]="'مميزات'" [title]="'مميزات المشروع'" />
      <app-icon-feature-grid [items]="projectDetails.features" [variant]="'features'" />
    </div>
    <div class="col-12">
      <app-section-title [subtitle]="'الضمانات'" [title]="'الضمانات'" />
      <app-icon-feature-grid [items]="mappedWarranties" [variant]="'warranties'" />
    </div>
  </div>

  <!-- Map -->
  <div class="row mb-5">
    <div class="col-12">
      <app-section-title [subtitle]="'الموقع'" [title]="'موقع المشروع على الخريطة'" />
      <app-project-map [lat]="projectDetails.map.lat" [lng]="projectDetails.map.lng" />
    </div>
  </div>
</div>

<app-contact-section></app-contact-section>
<app-footer></app-footer>
