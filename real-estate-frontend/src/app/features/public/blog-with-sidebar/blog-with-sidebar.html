<app-breadcrumb
        [items]="[
            { label: 'الرئيسية', url: '/' },
            { label: 'المدونة', url: '/blog' },
            { label: post()?.title ?? 'تفاصيل المدونة', url: '/blog/' + (post()?.id ?? '') }
        ]"
    />

<div class="container mb-5">
    <div class="blog-page" dir="rtl">
            <div class="row ">

                <div class="col-12 col-xxl-9">
                    <app-blog-post [post]="post()" />
                </div>

                <div class="col-12 col-xxl-3">
                    <app-unit-sidebar [units]="units()" (unitClick)="onUnitClick($event)" />
                </div>

        </div>
    </div>
</div>

<app-contact-section></app-contact-section>
