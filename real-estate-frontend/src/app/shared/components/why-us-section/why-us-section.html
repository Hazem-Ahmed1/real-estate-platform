<section class="why-us py-5 text-center">

  <div class="container">

    <!-- Header -->
    <div class="mb-5">
      <small class="text-success fw-bold">لماذا نحن</small>
      <h2 class="fw-bold main-title">خبراء العقارات محليًا وعالميًا</h2>
      <p class="text-muted">
        نحن نؤمن بأن الاستثمار العقاري الناجح يبدأ من هنا
      </p>
    </div>

    <!-- Cards -->
    <div class="row g-4 justify-content-center">
      <div class="col-md-6 col-lg-3"
           *ngFor="let card of cards()">
        <app-why-us-card [data]="card"></app-why-us-card>
      </div>
    </div>

  </div>

</section>
