<div class="nearby-places-grid">
  @for (place of nearbyPlaces(); track place.name) {
    <div class="nearby-place-item">
      <i [class]="'fa-solid ' + (place.iconClass ?? 'fa-location-dot')"></i>
      <h6 class="mb-1">{{ place.name }}</h6>
      <p class="mb-0">{{ place.distanceText }}</p>
    </div>
  }
</div>
