<div class="video-shell fade-in">
  <div
    #videoFrame
    class="video-frame"
    [class.video-frame--started]="started()"
    [class.video-frame--settings-open]="settingsOpen()">

    <button
      type="button"
      class="video-corner-btn"
      aria-label="ملء الشاشة"
      (click)="toggleFullscreen()">
      <i class="fa-solid fa-expand"></i>
    </button>

    @if (!started()) {
      <button
        type="button"
        class="video-poster-button"
        style="background: transparent;"
        (click)="playFromPoster()">
        <div class="video-center-play" aria-hidden="true">
          <i class="fa-solid fa-play"></i>
        </div>
      </button>
    }

    <video
      #videoElement
      class="project-video"
      playsinline
      disablePictureInPicture
      preload="metadata"
      [class.project-video--active]="started()"
      (loadedmetadata)="onLoadedMetadata()"
      (timeupdate)="onTimeUpdate()"
      (play)="onPlay()"
      (pause)="onPause()"
      (ended)="onEnded()"
      (volumechange)="onVolumeChange()"
      (click)="togglePlayPause()">
      <source [src]="videoUrl()" type="video/mp4" />
    </video>

    <div class="video-controls" role="group" aria-label="عناصر التحكم في الفيديو">
      <button
        type="button"
        class="video-control-btn"
        [attr.aria-label]="playing() ? 'إيقاف الفيديو مؤقتًا' : 'تشغيل الفيديو'"
        (click)="togglePlayPause()">
        <i class="fa-solid" [class.fa-play]="!playing()" [class.fa-pause]="playing()"></i>
      </button>

      <span class="video-time video-time--current" aria-live="polite">{{ currentTimeLabel() }}</span>

      <input
        type="range"
        class="video-progress"
        min="0"
        max="100"
        step="0.2"
        aria-label="شريط تقدم الفيديو"
        [value]="progress()"
        [style.--progress]="progress() + '%'"
        (input)="seek($event)" />

      <span class="video-time video-time--duration">{{ durationLabel() }}</span>

      <button
        type="button"
        class="video-control-btn video-more-toggle"
        aria-label="المزيد من عناصر التحكم"
        (click)="toggleMoreControls($event)">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>

      <div class="video-controls-group" [class.video-controls-group--open]="moreControlsOpen()">
        <div class="video-volume-container">
          <button
            type="button"
            class="video-control-btn video-volume-toggle"
            [attr.aria-label]="muted() ? 'إلغاء كتم الصوت' : 'مستوى الصوت'"
            (click)="toggleVolumeMenu($event)">
            <i class="fa-solid" [class.fa-volume-high]="!muted()" [class.fa-volume-xmark]="muted()"></i>
          </button>
        </div>

        <button
          type="button"
          class="video-control-btn video-settings-toggle"
          [attr.aria-label]="'إعدادات التشغيل (السرعة الحالية ' + playbackRate() + 'x)'"
          [attr.aria-expanded]="settingsOpen()"
          (click)="toggleSettingsMenu($event)">
          <i class="fa-solid fa-gear"></i>
        </button>

        <button
          type="button"
          class="video-control-btn"
          aria-label="ملء الشاشة"
          (click)="toggleFullscreen()">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
    </div>

    @if (settingsOpen()) {
      <div class="video-settings-menu" role="menu" aria-label="سرعة التشغيل">
        @for (speed of speedOptions; track speed) {
          <button
            type="button"
            role="menuitemradio"
            class="video-settings-option"
            [class.video-settings-option--active]="playbackRate() === speed"
            [attr.aria-checked]="playbackRate() === speed"
            (click)="setPlaybackRate(speed)">
            {{ speed }}x
          </button>
        }
      </div>
    }

    @if (volumeMenuOpen()) {
      <div class="video-volume-menu" role="menu" aria-label="مستوى الصوت" (click)="$event.stopPropagation()">
        <input
          type="range"
          class="video-volume"
          min="0"
          max="100"
          step="1"
          aria-label="مستوى الصوت"
          [value]="volumeLevel()"
          [style.--volume]="volumeLevel() + '%'"
          (input)="onVolumeInput($event)" />
      </div>
    }
  </div>
</div>
