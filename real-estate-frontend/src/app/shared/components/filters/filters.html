<div class="section-header flex-wrap d-flex justify-content-between align-items-center mb-4">
  <!-- TITLE -->
  <div class="title text-end">
    <span class="sub">{{ subTitle() }}</span>
    <h2>{{ title() }}</h2>
  </div>

  <!-- FILTERS -->
  <div class="text-start">
    <div class="filters d-flex gap-2">
      <button
        class="btn filter-btn"
        [class.active]="selectedFilter() === 'all'"
        (click)="filterBy('all')"
      >
        الــكل
      </button>

      <button
        class="btn filter-btn"
        [class.active]="selectedFilter() === 'sell'"
        (click)="filterBy('sell')"
      >
        للبيع
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </button>

      <button
        class="btn filter-btn"
        [class.active]="selectedFilter() === 'rent'"
        (click)="filterBy('rent')"
      >
        للإيجار
        <i class="fa-solid fa-key"></i>
      </button>

      <button class="btn filter-btn" (click)="toggleFilter()">
        فلتر
        <i class="fa-solid fa-sliders"></i>
      </button>
    </div>

    @if (showFilter()) {
      <div class="filter-panel mt-3 p-4">
        <!-- PRICE RANGE -->
        <div class="mb-4 text-end">
          <label class="filter-label">السعر</label>

          <div class="range-inputs d-flex gap-2 mt-2">
            <input
              type="number"
              class="form-control"
              placeholder="من"
              (input)="
                advancedFilters.update((f) => ({ ...f, minPrice: $any($event.target).value }))
              "
            />

            <input
              type="number"
              class="form-control"
              placeholder="إلى"
              (input)="
                advancedFilters.update((f) => ({ ...f, maxPrice: $any($event.target).value }))
              "
            />
          </div>
        </div>

        <!-- ROOMS -->
        <div class="mb-4 text-end">
          <label class="filter-label">عدد الغرف</label>

          <input
            type="number"
            class="form-control mt-2"
            placeholder="مثلاً 3"
            (input)="advancedFilters.update((f) => ({ ...f, rooms: $any($event.target).value }))"
          />
        </div>

        <!-- APPLY -->
        <div class="text-start">
          <button class="btn apply-btn" (click)="applyFilters()">تطبيق</button>
        </div>
      </div>
    }
  </div>
</div>
